[package]
name = "blackholes-rust"
version = "0.1.3"
edition = "2024"
authors = ["Andy Eulogio Sulluchuco"]
description = "A native, GPU-accelerated workspace for orchestrating coding agents."
license = "MPL-2.0"
repository = "https://github.com/andygeek/blackholes"

[dependencies]
anyhow = "1.0"
alacritty_terminal = "0.25.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
flume = "0.12"
gpui = "0.2.2"
gpui-component = { path = "vendor/gpui-component", features = ["tree-sitter-languages", "webview"] }
gpui-terminal = "0.1.0"
libc = "0.2"
parking_lot = "0.12"
notify = "7.0"
notify-rust = "4.18"
portable-pty = "0.9"
regex = "1.12"
rfd = "0.15"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"
wry = { version = "0.53.3", package = "lb-wry" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSImage", "NSPasteboard", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[build-dependencies]
cc = "1.2"

[package.metadata.bundle]
name = "Blackholes Rust"
identifier = "dev.blackholes.rust"
category = "Developer Tool"
short_description = "Native workspace for coding agents"
icon = ["assets/app-icon.icns"]
resources = ["agent-sidecar"]
osx_minimum_system_version = "13.0"
